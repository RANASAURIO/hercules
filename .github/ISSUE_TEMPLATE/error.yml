name: Reportar un error
description: Algo no funciona como debería
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si es una falla de seguridad, no la reportes aquí: sigue SECURITY.md.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describe el error. Si puedes, añade una captura de pantalla.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      placeholder: |
        1. Abre Rutinas
        2. Toca …
        3. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Dónde usas Hércules
      options:
        - App de Android (APK)
        - App web en el teléfono
        - App web en el computador
    validations:
      required: true
  - type: input
    id: numero
    attributes:
      label: Versión de la app
      description: Aparece al final de Ajustes.
      placeholder: "1.3"
  - type: input
    id: dispositivo
    attributes:
      label: Teléfono o navegador
      placeholder: "Samsung A54, Android 14 / Chrome 130"
